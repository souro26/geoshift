[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoshift"
version = "0.1.0"
description = "Geographic robustness and reliability evaluation for image classification"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]